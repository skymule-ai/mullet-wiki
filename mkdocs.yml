site_name: MULLET
site_description: SkyMule stack wiki — ROS 2 Jazzy, PX4 1.17
repo_url: https://github.com/skymule-ai/mullet-wiki
repo_name: skymule-ai/mullet-wiki
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    scheme: slate
    primary: custom
    accent: cyan
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

nav:
  - Home: index.md
  - Stack:
      - stack/index.md
      - mullet-interfaces: stack/interfaces.md
      - mullet-core: stack/core.md
      - mullet-paddock: stack/paddock.md
      - mullet_sitl_sim: stack/sitl.md
      - mullet_ros_base: stack/ros-base.md
      - sitl_builder: stack/sitl-builder.md
  - Frameworks:
      - frameworks/index.md
      - Ergodic MPPI: frameworks/ergodic-mppi.md

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/stack.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/skymule-ai
