site_name: MULLET
site_description: Skymule stack wiki — ROS 2 Jazzy, PX4 1.17
repo_url: https://github.com/skymule-ai/mullet-wiki
repo_name: skymule-ai/mullet-wiki
edit_uri: edit/main/docs/
strict: true
validation:
  anchors: warn

theme:
  name: material
  logo: assets/logos/skymule_full_white.svg
  favicon: assets/logos/skymule_icon_white-on-black.svg
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

nav:
  - Home: index.md
  - On Field:
      - on-field/index.md
      - Paddock: on-field/paddock.md
      - Mission Builder: on-field/mission-builder.md
      - Supervisor states: on-field/fsm.md
      - Running a framework: on-field/frameworks.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - Conventions: concepts/conventions.md
      - Glossary: concepts/glossary.md
  - Stack:
      - stack/index.md
      - mullet-interfaces: stack/interfaces.md
      - mullet-core: stack/core.md
      - mullet-px4: stack/px4.md
      - mullet-paddock: stack/paddock.md
      - mullet-localization: stack/localization.md
      - mullet-drivers: stack/drivers.md
      - mullet-vio: stack/vio.md
      - mullet-lio: stack/lio.md
      - mullet-base: stack/ros-base.md
      - mullet-sim: stack/sitl.md
  - Frameworks:
      - frameworks/index.md
      - Ergodic MPPI: frameworks/ergodic-mppi.md
  - Projects:
      - projects/index.md
      - Onboard mapping: projects/onboard-mapping.md
      - Obstacle-aware planner: projects/obstacle-aware-planner.md
      - Compressed voxel link: projects/voxel-link.md
      - Gaussian splat reconstruction: projects/gaussian-splat-reconstruction.md
  - Contributing: contributing.md

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/stack.js
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:
      check_paths: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/skymule-ai
