<svg viewBox="0 0 660 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="stale-title">
  <title id="stale-title">When MissionCommand stops, the supervisor holds in place after 0.25 s and leaves MISSION for HOLD after 2 s</title>
  <g font-size="15" fill="currentColor" font-weight="700">
    <text x="10" y="64">Commands</text>
    <text x="10" y="124">Supervisor</text>
  </g>
  <g stroke="currentColor" stroke-width="1.2" id="stale-ticks">
    <line x1="101.6" y1="50" x2="101.6" y2="72"/><line x1="105.2" y1="50" x2="105.2" y2="72"/><line x1="108.8" y1="50" x2="108.8" y2="72"/><line x1="112.4" y1="50" x2="112.4" y2="72"/><line x1="116.0" y1="50" x2="116.0" y2="72"/><line x1="119.6" y1="50" x2="119.6" y2="72"/><line x1="123.2" y1="50" x2="123.2" y2="72"/><line x1="126.8" y1="50" x2="126.8" y2="72"/><line x1="130.4" y1="50" x2="130.4" y2="72"/><line x1="134.0" y1="50" x2="134.0" y2="72"/><line x1="137.6" y1="50" x2="137.6" y2="72"/><line x1="141.2" y1="50" x2="141.2" y2="72"/><line x1="144.8" y1="50" x2="144.8" y2="72"/><line x1="148.4" y1="50" x2="148.4" y2="72"/><line x1="152.0" y1="50" x2="152.0" y2="72"/><line x1="155.6" y1="50" x2="155.6" y2="72"/><line x1="159.2" y1="50" x2="159.2" y2="72"/><line x1="162.8" y1="50" x2="162.8" y2="72"/><line x1="166.4" y1="50" x2="166.4" y2="72"/><line x1="170.0" y1="50" x2="170.0" y2="72"/>
  </g>
  <text x="182" y="66" font-size="15" style="fill: var(--md-default-fg-color--light)">stream stops</text>
  <rect x="100" y="104" width="115" height="30" rx="4" style="fill: var(--md-accent-fg-color); fill-opacity: 0.25; stroke: var(--md-accent-fg-color)"/>
  <rect x="215" y="104" width="315" height="30" rx="4" style="fill: var(--md-default-fg-color--lightest); stroke: var(--md-default-fg-color--light)"/>
  <rect x="530" y="104" width="120" height="30" rx="4" style="fill: var(--md-default-fg-color--lightest); stroke: currentColor"/>
  <g font-size="15" fill="currentColor">
    <text x="108" y="124">MISSION</text>
    <text x="225" y="124">MISSION, holding in place</text>
    <text x="568" y="124" font-weight="700">HOLD</text>
    <text x="225" y="152" style="fill: var(--md-default-fg-color--light)">heartbeat: command_stream_valid = false</text>
  </g>
  <g stroke-width="1.2" stroke-dasharray="3 4" style="stroke: var(--md-default-fg-color--light)">
    <line x1="170" y1="40" x2="170" y2="182"/>
    <line x1="215" y1="96" x2="215" y2="182"/>
    <line x1="530" y1="96" x2="530" y2="182"/>
  </g>
  <line x1="90" y1="182" x2="650" y2="182" stroke="currentColor" stroke-width="1.4"/>
  <g font-size="14" fill="currentColor" text-anchor="middle">
    <text x="164" y="200" text-anchor="end">last command</text>
    <text x="221" y="200" text-anchor="start">+0.25 s</text>
    <text x="221" y="218" text-anchor="start" style="fill: var(--md-default-fg-color--light)">command_timeout_s</text>
    <text x="530" y="200">+2.0 s</text>
    <text x="530" y="218" style="fill: var(--md-default-fg-color--light)">command_loss_hold_s</text>
  </g>
</svg>
